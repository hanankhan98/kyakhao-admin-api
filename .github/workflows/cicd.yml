name: Deploy kyakhao-admin-api

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop & remove existing container
        run: |
          docker rm -f kyakhao-api-2 || true

      - name: Build Docker image
        run: |
          docker build -t kyakhao-admin-api-2 .

      - name: Run container
        run: |
          docker run -d \
            --name kyakhao-api-2 \
            --network kyakhao-network-2 \
            -p 8088:8000 \
            -v /home/reflys-1/kyakhao-admin-media:/app/media \
            -e DB_NAME=kyakhaodb-2 \
            -e DB_USER=kyakhao-2 \
            -e DB_PASSWORD=12345678 \
            -e DB_HOST=kyakhao-db-2 \
            -e DB_PORT=5432 \
            kyakhao-admin-api-2

      - name: Verify container is running
        run: |
          sleep 3
          docker ps | grep kyakhao-api-2
